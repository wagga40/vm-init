name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck + bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Collect shell files
        id: files
        run: |
          set -euo pipefail
          existing=()
          for p in vm-init.sh modules scripts tests; do
            [[ -e "$p" ]] && existing+=("$p")
          done
          {
            echo 'files<<EOF'
            find "${existing[@]}" -type f -name '*.sh' | sort
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: bash -n (syntax check)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done <<< "${{ steps.files.outputs.files }}"
          exit "$fail"

      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t targets <<< "${{ steps.files.outputs.files }}"
          filtered=()
          for f in "${targets[@]}"; do
            [[ -n "$f" ]] && filtered+=("$f")
          done
          if [[ ${#filtered[@]} -eq 0 ]]; then
            echo "No shell files found"
            exit 0
          fi
          shellcheck --external-sources --source-path=modules "${filtered[@]}"

  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install yamllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' \
            vm-init.yml .github/workflows/

  unit-tests:
    name: Unit tests (bats, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats jq python3 fish
          if ! command -v yq >/dev/null; then
            sudo ./vm-init.sh prepare
          fi
          echo "/opt/vm-init/bin" >> "$GITHUB_PATH"
          jq --version

      - name: Run bats unit tests
        run: |
          if [[ -d tests/unit ]] && compgen -G 'tests/unit/*.bats' > /dev/null; then
            bats tests/unit
          else
            echo "No unit tests yet"
          fi

  integration-tests:
    name: Integration smoke tests
    # Runs in a privileged Ubuntu container so the suite matches the target
    # environment (Ubuntu 24.04) and so future tests that call root-only
    # tools (apt, systemctl, ufw, etc.) can execute without host drift.
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ubuntu:24.04
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      SUDO_USER: root
      TZ: UTC
      # Ensure /usr/local/bin is on PATH for yq/task installed below.
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install container prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            bash coreutils findutils sed grep gawk tar gzip xz-utils \
            curl ca-certificates git sudo \
            bats jq python3 util-linux
          useradd --create-home vm-init-test

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install yq (mikefarah v4)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 \
            -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Install go-task (for packaging round-trip)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 \
            https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin
          task --version

      - name: Run bats integration smoke tests
        run: |
          set -euo pipefail
          if [[ -d tests/integration ]] && compgen -G 'tests/integration/*.bats' > /dev/null; then
            bats --print-output-on-failure tests/integration
          else
            echo "No integration tests yet"
          fi

      - name: Upload vm-init log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vm-init-integration-logs
          path: |
            /opt/vm-init/logs/vm-init-*.log
            dist/
          if-no-files-found: ignore
          retention-days: 7

  service-tests:
    name: Live firewall and DNS (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build isolated service-test system
        run: docker build --build-arg UBUNTU_VERSION=${{ matrix.ubuntu }} -t vm-init-services tests/services
      - name: Run live service checks
        run: |
          set -euo pipefail
          docker run -d --name vm-init-services --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock -v "$PWD:/src:ro" \
            -e VM_INIT_SERVICE_TEST=1 vm-init-services
          for attempt in {1..30}; do
            if docker exec vm-init-services systemctl is-active --quiet dbus; then break; fi
            sleep 1
          done
          if docker exec vm-init-services bash /src/tests/services/run.sh > service-tests.log 2>&1; then
            cat service-tests.log
          else
            cat service-tests.log
            details=$(tail -n 80 service-tests.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Live service checks::$details"
            exit 1
          fi
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker logs vm-init-services || true
          docker exec vm-init-services journalctl -u dnsproxy -u systemd-resolved -u vm-init-firewall-rollback --no-pager -n 100 || true
      - name: Remove test container
        if: always()
        run: docker rm -f vm-init-services || true

  real-install-tests:
    name: Real install tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Prepare configuration tools
        run: |
          set -euo pipefail
          sudo ./vm-init.sh prepare
          export PATH="/opt/vm-init/bin:$PATH"
          echo "/opt/vm-init/bin" >> "$GITHUB_PATH"
          yq --version

      - name: Create CI config for safe hosted-runner execution
        run: |
          set -euo pipefail
          cat > ci-real-install.yml <<'YAML'
          users: [vm-init-ci, vm-init-ci-two]
          apt:
            enabled: true
            packages:
              cli: [jq]
              shell: [fish, bat, zoxide]
              extra: []
          ufw: {enabled: false}
          fail2ban: {enabled: false}
          dns: {enabled: false}
          docker: {enabled: false}
          python: {enabled: false}
          github_tools: {enabled: false}
          github_releases: {enabled: false}
          shell:
            enabled: true
            default_shell: fish
            fisher: false
            tide: false
            zoxide: true
            direnv: false
            aliases: {ll: "ls -l", cat: bat}
          YAML
          sudo useradd --create-home --shell /bin/bash vm-init-ci
          sudo useradd --create-home --shell /bin/bash vm-init-ci-two
          sudo useradd --create-home --shell /bin/bash vm-init-untouched

      - name: Validate selected modules from CI config
        run: |
          set -euo pipefail
          ./vm-init.sh --list-modules --config ci-real-install.yml

      - name: Run real package and account setup
        run: |
          set -euo pipefail
          sudo ./vm-init.sh --config ci-real-install.yml --only apt,shell

      - name: Run second pass to verify repeat execution
        run: |
          set -euo pipefail
          for account in vm-init-ci vm-init-ci-two; do
            sudo stat -c '%i:%Y:%Z' "/home/$account/.config/fish/conf.d/90-vm-init.fish"
          done > shell-before.txt
          sudo ./vm-init.sh --config ci-real-install.yml --only apt,shell --no-upgrade | tee second-pass.log
          for account in vm-init-ci vm-init-ci-two; do
            sudo stat -c '%i:%Y:%Z' "/home/$account/.config/fish/conf.d/90-vm-init.fish"
          done > shell-after.txt
          cmp shell-before.txt shell-after.txt
          if grep -q 'Start a new session' second-pass.log; then
            echo 'Unchanged shell setup repeated a session reminder'
            exit 1
          fi

      - name: Verify the installed state
        run: |
          set -euo pipefail
          trap 'echo "::error::Verification failed at line $LINENO: $BASH_COMMAND"' ERR
          if sudo ./vm-init.sh --config ci-real-install.yml --verify --only apt,shell > verification.log 2>&1; then
            cat verification.log
          else
            cat verification.log
            details=$(<verification.log)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Installed state verification::$details"
            exit 1
          fi
          test "$(getent passwd vm-init-untouched | cut -d: -f7)" = /bin/bash
          sudo ./vm-init.sh status --json --config ci-real-install.yml > status.json
          jq -e 'all(.modules[]; .status != "failed")' status.json
          jq -e '.modules[] | select(.name == "shell") | .configuration_state == "in_sync" and .changed == false' status.json
          for account in vm-init-ci vm-init-ci-two; do
            test "$(sudo stat -c %U "/home/$account/.config/fish/conf.d/90-vm-init.fish")" = "$account"
          done

      - name: Refuse shell writes redirected to a protected directory
        run: |
          set -euo pipefail
          sudo mkdir -m 0755 /var/tmp/vm-init-ci-protected
          sudo rm -r /home/vm-init-ci-two/.config/fish/conf.d
          sudo -u vm-init-ci-two ln -s /var/tmp/vm-init-ci-protected /home/vm-init-ci-two/.config/fish/conf.d
          if sudo ./vm-init.sh apply --restore-config --config ci-real-install.yml --only shell --user vm-init-ci-two --no-upgrade; then
            echo 'Shell setup unexpectedly wrote to a protected directory'
            exit 1
          fi
          test "$(stat -c %U /var/tmp/vm-init-ci-protected)" = root
          test ! -e /var/tmp/vm-init-ci-protected/90-vm-init.fish
