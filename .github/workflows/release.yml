name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must match VERSION, e.g. vX.Y.Z)'
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

  release:
    name: Build and publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a vX.Y.Z release tag'; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          version_in_file=$(tr -d '[:space:]' < VERSION)
          expected="${{ steps.tag.outputs.version }}"
          if [[ "$version_in_file" != "$expected" ]]; then
            echo "::error::VERSION file says '${version_in_file}' but tag is '${{ steps.tag.outputs.tag }}' (expected '$expected')"
            exit 1
          fi

      - name: Install Task
        run: |
          curl -fsSL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Build tarball
        run: task package

      - name: Build single-file bundle
        run: task build-single

      - name: Verify release artifacts
        run: |
          task verify
          task verify-single

      - name: Prepare release assets (unversioned filenames)
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          cd dist
          cp "vm-init-${version}"        "vm-init"
          cp "vm-init-${version}.tar.gz" "vm-init.tar.gz"
          sha256sum vm-init        > vm-init.sha256
          sha256sum vm-init.tar.gz > vm-init.tar.gz.sha256

      - name: Summarize artifacts
        run: |
          ls -la dist/
          cat dist/vm-init.tar.gz.sha256
          cat dist/vm-init.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          tarball="dist/vm-init.tar.gz"
          tarball_sha="${tarball}.sha256"
          bundle="dist/vm-init"
          bundle_sha="${bundle}.sha256"

          notes_file=$(mktemp)
          {
            echo "## vm-init ${tag}"
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sudo bash"
            echo "sudo vm-init"
            echo "sudo vm-init status"
            echo '```'
            echo ""
            echo "The installer verifies the release tarball. The first vm-init run prepares tools, guides configuration, and applies it."
            echo "Standalone bundles also include offline recovery: sudo vm-init repair dns."
            echo "See README.md for checksum-verified single-file installation, account selection, and automation."
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat "$tarball_sha"
            cat "$bundle_sha"
            echo '```'
          } > "$notes_file"

          assets=("$tarball" "$tarball_sha" "$bundle" "$bundle_sha")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "vm-init ${tag}" \
              --notes-file "$notes_file"
          fi
